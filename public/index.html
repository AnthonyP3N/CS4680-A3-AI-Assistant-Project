<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FocusFlow</title>
  <meta name="description" content="Plan your work, track real time, reflect, and get realistic AI plans.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d2b3a'/%3E%3Crect x='7' y='9' width='18' height='4' rx='2' fill='%23f2c94c'/%3E%3Crect x='7' y='16' width='12' height='4' rx='2' fill='%238fb3d9'/%3E%3Crect x='7' y='23' width='7' height='2' rx='1' fill='%238fb3d9'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="shell">
    <nav class="rail" aria-label="Main">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--ink)"/><rect x="7" y="9" width="18" height="4" rx="2" fill="var(--hl)"/><rect x="7" y="16" width="12" height="4" rx="2" fill="var(--rule-strong)"/><rect x="7" y="23" width="7" height="2" rx="1" fill="var(--rule-strong)"/></svg>
        <span>FocusFlow</span>
      </div>
      <ul class="nav">
        <li><a href="#today" data-nav="today"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/></svg><span>Today</span></a></li>
        <li><a href="#focus" data-nav="focus"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span>Focus</span></a></li>
        <li><a href="#journal" data-nav="journal"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 8h7M8 12h7"/></svg><span>Journal</span></a></li>
        <li><a href="#insights" data-nav="insights"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Insights</span></a></li>
        <li><a href="#coach" data-nav="coach"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>Coach</span></a></li>
      </ul>
      <button class="rail-settings" type="button" data-action="open-settings">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <div class="page">
      <header class="topbar">
        <div id="topbar-date" class="topbar-date"></div>
        <div id="timer-pill"></div>
      </header>
      <div id="offline" class="banner" hidden role="status">You’re offline. A running timer keeps counting; changes will need a connection to save.</div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="confirm" class="dialog">
    <form method="dialog">
      <p data-msg></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" value="cancel">Cancel</button>
        <button data-ok value="ok">Delete</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings" class="dialog dialog-wide" aria-labelledby="settings-title"></dialog>
  <dialog id="stop-dialog" class="dialog" aria-labelledby="stop-title"></dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
